{% extends "index.html" %}
{% block content %}
<section class="border rounded-3 border-dark border-2 main p-3 text-center">

    <h1 class="heading" title="Expedice Mars Mission Control">EMMC komunikace</h1>

    <a class="documentation-link align-self-center mt-3" href="{{url_for('documentation')}}">
        Návod pro posádku
    </a>
    <form method="post" class="crew-selection">
        {% for name in jmena_posadky %}
        <button class="btn custom-button crew-button" value="{{name}}" name="name">{{name}}</button>
        {% endfor %}
    </form>
</section>
{% endblock %}
